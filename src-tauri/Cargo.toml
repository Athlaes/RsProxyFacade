[package]
name = "rs-proxy-facade"
version = "0.1.0"
description = "A Tauri App"
authors = ["Athlaes chartierlucas@outlook.fr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rs_proxy_facade_lib"

[dependencies]
async-trait = "0.1.92"
display-error-chain = "0.2.2"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }


[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Networking_WinInet"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
